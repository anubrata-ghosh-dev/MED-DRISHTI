services:
  - type: web
    name: med-drishti-api
    runtime: python
    rootDir: backend
    buildCommand: apt-get update && apt-get install -y tesseract-ocr poppler-utils && pip install -r requirements.txt
    preDeployCommand: alembic upgrade head && python -m app.seed_kiosk
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      # Set DATABASE_URL manually in Render dashboard (use Internal Database URL)
      - key: DATABASE_URL
        sync: false
      # Set JWT_SECRET_KEY manually in Render dashboard
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      # Set SARVAM_API_KEY manually in Render dashboard
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_TTS_SPEAKER
        value: shubh
      # Set GOOGLE_API_KEY manually in Render dashboard
      - key: GOOGLE_API_KEY
        sync: false
      - key: OCR_DEMO_MODE
        value: "false"
      - key: TESSERACT_PATH
        value: /usr/bin/tesseract
      - key: KIOSK_EMAIL
        value: kiosk@meddrishti.in
      # Set KIOSK_PASSWORD manually in Render dashboard
      - key: KIOSK_PASSWORD
        sync: false
      # Set CORS_ORIGINS manually after Vercel deploy (your Vercel URL)
      - key: CORS_ORIGINS
        sync: false
